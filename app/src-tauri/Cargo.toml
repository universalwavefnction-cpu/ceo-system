[package]
name = "ceo-app"
version = "0.1.0"
description = "Which CEOs are online, which are working, and each order's build, read from the board's status files"
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
